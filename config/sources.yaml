# RSS収集元の一覧。
# 利用者は日本語話者のため、原則として日本語で読める記事の収集先に限定する。
# enabled: false のものは停止中・URL未確定のもの（理由をコメントに記載）。
# group / site は「出典サイト一覧」ページの表示用（site はRSSではなく人が見るページのURL）。
# name の（ハッシュタグ: ○○）等は記事一覧では媒体名から外し、#○○ のハッシュタグとして表示する。
# 収集後、Geminiが「会社員が仕事で試せる・知っておくべき内容か」を判定し、該当しない記事は掲載しない。
sources:
  # --- Office・Windowsの使い方 ---
  - name: できるネット
    url: https://dekiru.net/feed
    site: https://dekiru.net/
    group: Office・Windowsの使い方
    enabled: true
    keyword_filter: false
    max_items: 20

  - name: 窓の杜
    url: https://forest.watch.impress.co.jp/data/rss/1.0/wf/feed.rdf
    site: https://forest.watch.impress.co.jp/
